<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mondo Vivo — core stabile</title>
<style>
  :root{--notte:#0a0e14;--asfalto:#141a23;--ambra:#e0a458;--ciano:#6fd3d8;--ghiaccio:#dfe7ee;--tenue:#5c6a7a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--notte);color:var(--ghiaccio);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column}
  #viste{flex:1;display:flex;flex-direction:column;min-height:0}
  .pannello{position:relative;flex:1;min-height:0;overflow:hidden}
  .pannello canvas{display:block;width:100%;height:100%}
  .targa{position:absolute;top:6px;left:8px;font-size:10px;letter-spacing:.08em;color:var(--tenue);pointer-events:none;z-index:3}
  body.solo-ascii #p3d,body.solo-3d #pascii{display:none}
  body:not(.split) .targa{display:none}
  body.split #pascii{border-bottom:1px solid #1d2531}
  @media (orientation:landscape){body.split #viste{flex-direction:row}
    body.split #pascii{border-bottom:0;border-right:1px solid #1d2531}}
  #hud{flex:0 0 auto;background:#0d131b;border-top:1px solid #1d2531;color:var(--tenue);
    font-size:10px;line-height:1.5;padding:5px 9px;font-variant-numeric:tabular-nums;
    cursor:pointer;white-space:pre-wrap}
  #hud .riga2{display:none}
  #hud.aperto .riga2{display:block}
  #hud b{font-weight:400;color:var(--ghiaccio)}
  #hud .cal{color:var(--ambra)}
  #hud .fir{color:var(--ciano)}
  #barra{display:flex;flex-wrap:wrap;gap:1px;background:#1d2531;flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom)}
  #barra button{flex:1 1 30%;border:0;background:var(--asfalto);color:var(--tenue);font:inherit;font-size:11px;
    letter-spacing:.06em;padding:11px 4px;cursor:pointer}
  #barra button[aria-pressed="true"]{background:#1f2a38;color:var(--ambra)}
  #barra button:focus-visible{outline:2px solid var(--ciano);outline-offset:-2px}
  #stick{position:absolute;z-index:4;width:104px;height:104px;margin:-52px 0 0 -52px;
    border:1px solid rgba(111,211,216,.32);border-radius:50%;opacity:0;transition:opacity .12s;pointer-events:none}
  #stick.on{opacity:1}
  #pollice{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    background:rgba(111,211,216,.22);border:1px solid rgba(111,211,216,.55)}
  #aiuto{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10px;color:var(--tenue);
    z-index:3;pointer-events:none;transition:opacity .4s}
  #errore{position:absolute;inset:auto 12px 44px;padding:10px;font-size:11px;line-height:1.5;color:var(--ambra);
    background:rgba(10,14,20,.94);border-left:2px solid var(--ambra);display:none;z-index:6}

  /* ══ MINIMAPPA MONDO VIVO ═══════════════════════════════════════ */
  #miniMap{
    position:absolute;z-index:20;
    top:max(9px,env(safe-area-inset-top));right:9px;
    width:94px;height:94px;overflow:hidden;
    border:1px solid rgba(111,211,216,.62);border-radius:11px;
    background:rgba(7,12,18,.92);box-shadow:0 8px 30px rgba(0,0,0,.45);
    touch-action:none;cursor:pointer;
    transition:width .18s,height .18s,inset .18s,border-radius .18s
  }
  #miniMap.open{
    position:fixed;inset:max(12px,env(safe-area-inset-top)) 12px
      max(12px,env(safe-area-inset-bottom)) 12px;
    width:auto;height:auto;border-radius:15px;background:rgba(6,10,16,.98)
  }
  #miniCanvas{display:block;width:100%;height:100%}
  #miniLabel{
    position:absolute;top:5px;left:6px;padding:2px 5px;border-radius:4px;
    color:#dfe7ee;background:rgba(5,9,14,.74);font-size:9px;
    letter-spacing:.08em;pointer-events:none
  }
  #miniClose{
    position:absolute;top:9px;right:9px;display:none;
    width:38px;height:38px;margin:0;padding:0;
    border:1px solid rgba(223,231,238,.38);border-radius:50%;
    background:rgba(10,14,20,.9);color:#dfe7ee;font:22px/1 sans-serif
  }
  #miniMap.open #miniClose{display:block}
  #miniMap.open #miniLabel{top:11px;left:11px;font-size:11px}

  @media (prefers-reduced-motion:reduce){#stick,#aiuto,#miniMap{transition:none}}
</style>
</head>
<body class="split">
<div id="app">
  <div id="viste">
    <div class="pannello" id="pascii"><canvas id="cvA"></canvas><div class="targa">vista ascii</div></div>
    <div class="pannello" id="p3d"><canvas id="cv3"></canvas><div class="targa">vista 3d</div></div>
  </div>
  <div id="barra">
    <button id="bAscii" aria-pressed="false">ascii</button>
    <button id="bSplit" aria-pressed="true">doppia</button>
    <button id="b3d" aria-pressed="false">3d</button>
    <button id="bStile" aria-pressed="false">a piedi</button>
    <button id="bFinto" aria-pressed="false">prova rete</button>
  </div>
  <div id="hud"></div>
  <div id="stick"><div id="pollice"></div></div>

  <div id="miniMap" role="button" tabindex="0"
       aria-label="Apri minimappa" aria-expanded="false">
    <canvas id="miniCanvas"></canvas>
    <div id="miniLabel">mappa</div>
    <button id="miniClose" type="button" aria-label="Chiudi minimappa">×</button>
  </div>
  <div id="aiuto">sinistra: muovi · destra: ruota o tocca per saltare · tocca la mappa per aprirla</div>
  <div id="errore"></div>
</div>

<!-- ══ core.js, iniettato senza modifiche: è lo stesso file che gira su Node ══ -->
<script>(function(){
/* ══════════════════════════════════════════════════════════════════════
   core.js — simulazione pura e deterministica.

   Vincoli che questo file rispetta e che NON vanno rotti:
     · nessun DOM, nessun THREE, nessun require di ambiente
     · nessun Math.random
     · nessuna funzione trascendente nel percorso di simulazione
       (Math.exp / sin / cos / pow / hypot NON sono bit-identiche tra
        motori JS: V8 e JavaScriptCore possono divergere sull'ultimo bit,
        e in 600 tick quella divergenza si amplifica fino a rompere il
        lockstep). Ammessi solo: imul, sqrt, floor, ceil, round, abs,
        min, max — esattamente specificati da IEEE-754 / ECMA-262.
   ══════════════════════════════════════════════════════════════════════ */

/* Versione dello schema di simulazione. Va alzata a ogni modifica che
   cambia la firma: generazione del mondo, fisica, parametri delle corsie.
   Client e server si rifiutano di parlarsi se PROTO non coincide. */
const PROTO = 7;

const CFG = {
  SEED: 20260902,
  TICK_HZ: 20,
  PASSO: 1 / 20,
  CHUNK: 64,
  LINEA: 32,        // passo della griglia stradale
  OFF: 4,           // centro carreggiata: coord ≡ 4 (mod 32)
  RAGGIO_CH: 3,
  MAX_ENT: 256,     // entità DI RETE: giocatori + auto promosse. Non il traffico.
  MAX_AUTO: 448,    // buffer di valutazione del traffico ambientale
  MAX_PEDONI: 128,
};

/* Attriti precalcolati: exp(-k/20) come letterali.
   Calcolarli a runtime reintrodurrebbe Math.exp nel percorso critico. */
const STILE = [
  { acc: 46, vmax: 7.5, attrito: 0.6703200460356393, raggio: 0.42 },  // 0 = a piedi
  { acc: 78, vmax: 26,  attrito: 0.7710515858035663, raggio: 0.95 },  // 1 = in auto
];

/* ══ SAGOMA — la forma che il core considera colpibile.
   È la stessa che il renderer disegna come scheletro: con le monete in
   gioco, ciò che vedi deve essere ciò che colpisci. Cambiarla qui senza
   cambiarla nel renderer è il bug più costoso possibile. ══ */
const SAGOMA = {
  altezza: 1.88,
  corpo: { r: 0.28, y0: 0.30, y1: 1.50 },   // capsula bacino→spalle
  testa: { r: 0.17, y: 1.73 },
};

/* ══════════ 1. PRNG — hash intero, senza stato ══════════ */

function hash32(a, b, c){
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  h = Math.imul(h, 2246822519);
  h ^= h >>> 13;
  return h >>> 0;
}
const rnd = (a, b, c) => hash32(a, b, c) / 4294967296;

/* ══════════ 2. MONDO — chunk generati da seed, in cache ══════════

   Tutto il contenuto STATICO (edifici, auto parcheggiate, alberi, pali,
   arredo) vive nel chunk, non in un campo interrogato a runtime. È lo
   stesso identico contratto — funzione pura di (cx, cy, seme) — solo
   materializzato per chunk invece che per query. In cambio: nessuna
   dipendenza da `t`, quindi nessuna delle divergenze che il traffico in
   movimento ci ha fatto inseguire. Resta un campo solo per ciò che si
   muove davvero senza essere un giocatore: i pedoni.
   ══════════════════════════════════════════════════════════════════ */

const chunkCache = new Map();
let chunkGenerati = 0;

const PASSO_GRIGLIA = 32, CORRIDOIO = 8, MARCIAPIEDE = 1.5;
const APRON = 3;                      // allargamento delle arterie, preso all'isolato

/* Gerarchia stradale. Una corsia su quattro circa è arteria: più larga,
   alberata, con parcheggio su entrambi i lati. Il resto sono secondarie. */
function arteria(asse, li){
  return rnd(asse * 977 + li, 4409, CFG.SEED ^ 0x2f1a77b3) < .27;
}

/* Vicino a un incrocio non si parcheggia e non si piantano alberi.
   È una funzione pura della coordinata, quindi resta O(1). */
const semiIncrocio = CORRIDOIO / 2 + 2.5;
function inIncrocio(v){
  const c = Math.round((v - CFG.OFF) / PASSO_GRIGLIA) * PASSO_GRIGLIA + CFG.OFF;
  const d = v - c;
  return (d < 0 ? -d : d) < semiIncrocio;
}

/* Sei tipi di isolato. È questo, più della griglia, a togliere la
   monotonia: Manhattan è una griglia e non annoia nessuno — annoia
   avere ogni isolato identico al precedente. */
const TIPO_ISOLATO = { TORRI:0, PALAZZINE:1, CAPANNONE:2, PARCO:3, PIAZZA:4, PARCHEGGIO:5 };

function tipoIsolato(r, centralita){
  // in centro torri e palazzine, in periferia capannoni, parchi e parcheggi
  const pesi = [
    .05 + .38 * centralita,        // torri
    .18 + .22 * centralita,        // palazzine
    .22 - .16 * centralita,        // capannone
    .20 - .07 * centralita,        // parco
    .09 + .03 * centralita,        // piazza
    .16 - .10 * centralita,        // parcheggio
  ];
  let somma = 0; for (const p of pesi) somma += p;
  let acc = 0, v = r * somma;
  for (let i = 0; i < pesi.length; i++){ acc += pesi[i]; if (v < acc) return i; }
  return TIPO_ISOLATO.PALAZZINE;
}

/* Un edificio alto non è un parallelepipedo: rientra salendo. Costa due
   istanze in più e cambia completamente lo skyline. */
function alzaEdificio(out, x, y, w, d, h, tinta, seme){
  out.push({ x, y, w, d, h: h * (h > 22 ? .58 : 1), t: tinta });
  if (h <= 22){
    if (rnd(seme, 7, 0) > .55)        // volumetto tecnico sul tetto
      out.push({ x: x + w * .3, y: y + d * .3, w: w * .35, d: d * .35, h: h + 1.6, t: tinta });
    return;
  }
  const r1 = .74 + rnd(seme, 8, 0) * .12;
  out.push({ x: x + w * (1 - r1) / 2, y: y + d * (1 - r1) / 2,
             w: w * r1, d: d * r1, h: h * .86, t: tinta });
  if (h > 38){
    const r2 = r1 * (.62 + rnd(seme, 9, 0) * .12);
    out.push({ x: x + w * (1 - r2) / 2, y: y + d * (1 - r2) / 2,
               w: w * r2, d: d * r2, h: h, t: tinta });
    out.push({ x: x + w * .47, y: y + d * .47, w: w * .06, d: d * .06,
               h: h * (1.06 + rnd(seme, 10, 0) * .12), t: tinta });   // antenna
  }
}

function albero(out, x, y, s, grande){
  const h = (grande ? 3.4 : 2.4) + s * (grande ? 2.6 : 1.4);
  out.push({ x, y, h, r: .16 + s * .08, cr: (grande ? 1.5 : 1.05) + s * .8,
             ch: h * (.72 + s * .12), t: (s * 3) | 0 });
}

function generaChunk(cx, cy){
  const ox = cx * CFG.CHUNK, oy = cy * CFG.CHUNK;
  const isolati = [], edifici = [], auto = [], alberi = [], pali = [], arredi = [];

  // corsie che delimitano i due isolati per asse
  const LX = [cx * 2, cx * 2 + 1, (cx + 1) * 2];
  const LY = [cy * 2, cy * 2 + 1, (cy + 1) * 2];
  const distretto = (rnd(cx >> 2, cy >> 2, CFG.SEED ^ 0x51ab) * 4) | 0;

  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++){
    const bx = ox + (i ? 40 : 8), by = oy + (j ? 40 : 8), L = 24;
    // le arterie mangiano tre metri all'isolato: i palazzi arretrano
    const aW = arteria(0, LX[i])     ? APRON : 0;
    const aE = arteria(0, LX[i + 1]) ? APRON : 0;
    const aS = arteria(1, LY[j])     ? APRON : 0;
    const aN = arteria(1, LY[j + 1]) ? APRON : 0;
    const IX = bx + aW, IY = by + aS, IW = L - aW - aE, ID = L - aS - aN;
    isolati.push({ x: bx, y: by, w: L, d: L });

    const seme = (cx * 73856093) ^ (cy * 19349663) ^ ((i * 2 + j) * 83492791);
    const cent = 1 / (1 + Math.sqrt(bx * bx + by * by) / 700);
    const tipo = tipoIsolato(rnd(seme, 1, CFG.SEED), cent);
    const tinta = (distretto * 3 + ((rnd(seme, 2, 0) * 3) | 0)) % 12;

    if (tipo === TIPO_ISOLATO.PARCO){
      isolati[isolati.length - 1].verde = 1;
      for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++){
        const s = rnd(seme + a * 31, b * 17, CFG.SEED + 5);
        if (s > .72) continue;
        albero(alberi, IX + (a + .3 + rnd(seme + a, b, 3) * .4) * IW / 5,
                       IY + (b + .3 + rnd(seme + b, a, 4) * .4) * ID / 5, s, true);
      }
      continue;
    }
    if (tipo === TIPO_ISOLATO.PIAZZA){
      isolati[isolati.length - 1].lastra = 1;
      const s = rnd(seme, 6, 0);
      if (s > .45)                                   // monumento
        edifici.push({ x: IX + IW * .42, y: IY + ID * .42, w: IW * .16, d: ID * .16,
                       h: 4 + s * 7, t: tinta });
      for (let a = 0; a < 4; a++){
        const q = rnd(seme + a, 11, 0);
        arredi.push({ x: IX + (.18 + q * .64) * IW, y: IY + (a * .26 + .1) * ID,
                      w: 1.6, d: .5, h: .45, t: 1 });
      }
      continue;
    }
    if (tipo === TIPO_ISOLATO.PARCHEGGIO){
      isolati[isolati.length - 1].asfalto = 1;
      const file = 3, perFila = 5;
      for (let a = 0; a < file; a++) for (let b = 0; b < perFila; b++){
        if (rnd(seme + a * 7, b * 13, CFG.SEED + 6) > .74) continue;
        auto.push({ x: IX + (a + .5) * IW / file, y: IY + (b + .5) * ID / perFila,
                    asse: 1, t: (rnd(seme + a, b, 8) * 6) | 0 });
      }
      continue;
    }

    // tipi costruiti
    let col = 2, rig = 2, altezza = 1;
    if (tipo === TIPO_ISOLATO.TORRI){ col = rnd(seme, 3, 0) < .55 ? 1 : 2; rig = col; altezza = 2.5; }
    if (tipo === TIPO_ISOLATO.CAPANNONE){ col = 1; rig = 1; altezza = .32; }
    const m = 1.6, g = 1.5;
    const lw = (IW - m * 2 - g * (col - 1)) / col;
    const ld = (ID - m * 2 - g * (rig - 1)) / rig;
    for (let a = 0; a < col; a++) for (let b = 0; b < rig; b++){
      const s = rnd(seme + a * 101, b * 211, CFG.SEED + 7);
      if (tipo !== TIPO_ISOLATO.CAPANNONE && s > .90) continue;      // lotto vuoto
      const ex = IX + m + a * (lw + g), ey = IY + m + b * (ld + g);
      const dist = Math.sqrt(ex * ex + ey * ey);
      const scala = 1 + 4.2 / (1 + dist / 300);
      alzaEdificio(edifici, ex, ey, lw, ld, (3 + s * 13) * scala * altezza,
                   (tinta + (a + b)) % 12, seme + a * 13 + b);
    }
  }

  /* Corridoi stradali: il chunk possiede quelli sui suoi lati bassi, così
     nessuno viene generato due volte. Auto in sosta, pali, alberi. */
  for (let asse = 0; asse < 2; asse++){
    const li = asse === 0 ? LX[0] : LY[0];
    const centro = (asse === 0 ? ox : oy) + CFG.OFF;
    const grande = arteria(asse, li);
    const lati = grande ? [-1, 1] : [rnd(li, asse, CFG.SEED + 12) < .5 ? -1 : 1];
    const sostaOff = CORRIDOIO / 2 - MARCIAPIEDE - .95;      // contro il marciapiede
    const passoSosta = 6.4, passoPalo = grande ? 15 : 22, passoAlbero = 9.5;
    const inizio = asse === 0 ? oy : ox;

    for (const lato of lati){
      const trasv = centro + lato * sostaOff;
      for (let k = 0; k < CFG.CHUNK / passoSosta; k++){
        const lungo = inizio + (k + .5) * passoSosta;
        if (inIncrocio(lungo)) continue;                     // niente sosta sugli incroci
        if (rnd(li * 31 + k, asse * 7 + lato, CFG.SEED + 13) > (grande ? .72 : .58)) continue;
        auto.push(asse === 0
          ? { x: trasv, y: lungo, asse: 1, t: (rnd(li + k, lato, 21) * 6) | 0 }
          : { x: lungo, y: trasv, asse: 0, t: (rnd(li + k, lato, 21) * 6) | 0 });
      }
      const paloOff = CORRIDOIO / 2 - .5;
      for (let k = 0; k < CFG.CHUNK / passoPalo; k++){
        const lungo = inizio + (k + .5) * passoPalo;
        if (inIncrocio(lungo)) continue;
        const tx = centro + lato * paloOff;
        pali.push(asse === 0 ? { x: tx, y: lungo, asse } : { x: lungo, y: tx, asse });
      }
      if (!grande) continue;
      const albOff = CORRIDOIO / 2 + APRON * .5;             // nell'allargamento
      for (let k = 0; k < CFG.CHUNK / passoAlbero; k++){
        const lungo = inizio + (k + .5) * passoAlbero;
        if (inIncrocio(lungo)) continue;
        const s = rnd(li * 17 + k, lato * 3, CFG.SEED + 14);
        if (s > .82) continue;
        const tx = centro + lato * albOff;
        albero(alberi, asse === 0 ? tx : lungo, asse === 0 ? lungo : tx, s, false);
      }
    }
  }

  chunkGenerati++;
  return { cx, cy, isolati, edifici, auto, alberi, pali, arredi };
}

function chunk(cx, cy){
  const k = cx + ',' + cy;
  let c = chunkCache.get(k);
  if (!c){ c = generaChunk(cx, cy); chunkCache.set(k, c); }
  return c;
}

const suLinea = v => Math.round((v - CFG.OFF) / CFG.LINEA) * CFG.LINEA + CFG.OFF;

const visibili = [];
function aggiornaVisibili(x, y){
  visibili.length = 0;
  const cx = Math.floor(x / CFG.CHUNK), cy = Math.floor(y / CFG.CHUNK), R = CFG.RAGGIO_CH;
  for (let i = -R; i <= R; i++) for (let j = -R; j <= R; j++) visibili.push(chunk(cx + i, cy + j));
  return cx + ':' + cy;
}

/* ══════════ 3. PEDONI AMBIENTALI — forma chiusa ══════════

   Non è fatto di entità e non ha stato accumulato. Ogni auto occupa
   uno slot fisso k sulla sua corsia; la posizione è una funzione pura
   di (corsia, k, t):

       pos = k*PASSO_SLOT + fase + dir*velocità*t + jitter(k)

   Conseguenze, tutte volute:
     · valutabile a QUALSIASI t in O(1): un client che entra al tick
       90.000 vede esattamente le stesse auto degli altri, senza
       rigiocare la storia e senza ricevere un byte
     · velocità uniforme per corsia ⇒ nessun sorpasso, nessuna collisione
       tra auto, nessuna risoluzione da simulare
     · interpolazione gratis: si valuta a t frazionario, non si lerpa
     · niente svolte agli incroci. È il prezzo della forma chiusa:
       l'alternativa (catena di decisioni dallo spawn) costa un recupero
       proporzionale all'età dell'auto ogni volta che ne entra una in vista.

   Quando un giocatore tocca un'auto, il server la PROMUOVE: le assegna
   uno slot in ENT e da lì è replicata come qualsiasi entità. Il traffico
   ambientale resta a costo di rete zero.
   ══════════════════════════════════════════════════════════════════ */

/* Profili di corsia. Stessa matematica, parametri diversi:
   il pattern in forma chiusa si generalizza a qualsiasi flusso ambientale. */
/* Resta un solo profilo: i pedoni. Il traffico automatico è stato tolto
   per scelta di gioco — tutto ciò che si muove dev'essere una persona —
   e le auto in sosta sono passate nel chunk, dove non dipendono da `t`.
   L'offset porta i pedoni contro il marciapiede, fuori dalla sosta. */
const PEDONE_PROF = { off: 3.4, slot: 9, jit: 1.4, vmin: 1.0, vspan: .9, vuoto: 2400000000, seme: 0x1d3ab77f };

function buffer(n){
  return { x: new Float32Array(n), y: new Float32Array(n),
           asse: new Uint8Array(n), dir: new Int8Array(n),
           tinta: new Uint8Array(n), n: 0 };
}
const PEDONI = buffer(CFG.MAX_PEDONI);

function queryCorsie(x0, y0, x1, y1, t, out, prof){
  const B = out, P = prof, CAP = B.x.length;
  let n = 0;
  for (let asse = 0; asse < 2; asse++){
    const c0 = asse === 0 ? y0 : x0, c1 = asse === 0 ? y1 : x1;
    const a0 = asse === 0 ? x0 : y0, a1 = asse === 0 ? x1 : y1;
    const li0 = Math.floor((c0 - CFG.OFF - P.off) / CFG.LINEA);
    const li1 = Math.ceil((c1 - CFG.OFF + P.off) / CFG.LINEA);
    for (let li = li0; li <= li1; li++){
      const centro = li * CFG.LINEA + CFG.OFF;
      for (let d = 0; d < 2; d++){
        const dir = d ? -1 : 1;
        const trasv = centro + (asse === 0 ? dir * P.off : -dir * P.off);
        if (trasv < c0 || trasv > c1) continue;
        const sem = hash32(asse * 131 + li, dir, CFG.SEED ^ P.seme);
        const vel = P.vmin + (hash32(sem, 1, 0) / 4294967296) * P.vspan;
        const scorr = (hash32(sem, 2, 0) / 4294967296) * P.slot + dir * vel * t;
        const k0 = Math.ceil((a0 - scorr - P.jit) / P.slot);
        const k1 = Math.floor((a1 - scorr + P.jit) / P.slot);
        for (let k = k0; k <= k1; k++){
          if (hash32(sem, 3, k) < P.vuoto) continue;
          if (n >= CAP){ B.n = n; return n; }
          const lungo = k * P.slot + scorr + (hash32(sem, 4, k) / 4294967296 - .5) * 2 * P.jit;
          if (asse === 0){ B.x[n] = lungo; B.y[n] = trasv; }
          else           { B.y[n] = lungo; B.x[n] = trasv; }
          B.asse[n] = asse; B.dir[n] = dir;
          B.tinta[n] = hash32(sem, 5, k) & 3;
          n++;
        }
      }
    }
  }
  B.n = n;
  return n;
}

const queryPedoni = (x0, y0, x1, y1, t, out) => queryCorsie(x0, y0, x1, y1, t, out || PEDONI, PEDONE_PROF);

/* ══════════ 4. ENTITÀ DI RETE ══════════ */

const N = CFG.MAX_ENT;
const ENT = {
  x:  new Float32Array(N), y:  new Float32Array(N), z:  new Float32Array(N),
  px: new Float32Array(N), py: new Float32Array(N), pz: new Float32Array(N),
  vx: new Float32Array(N), vy: new Float32Array(N), vz: new Float32Array(N),
  tipo: new Uint8Array(N), viva: new Uint8Array(N),
  stile: new Uint8Array(N),           // 0 a piedi, 1 in auto
};
const GIOC = 0;
const stato = { tick: 0, t: 0 };

function reset(x, y){
  ENT.viva.fill(0); ENT.tipo.fill(0);
  ENT.viva[GIOC] = 1; ENT.tipo[GIOC] = 1;
  ENT.x[GIOC] = ENT.px[GIOC] = x; ENT.y[GIOC] = ENT.py[GIOC] = y;
  ENT.z[GIOC] = ENT.pz[GIOC] = 0;
  ENT.vx[GIOC] = ENT.vy[GIOC] = ENT.vz[GIOC] = 0;
  ENT.stile[GIOC] = 0;
  stato.tick = 0; stato.t = 0;
}

/* ══════════ 5. COLLISIONE ══════════

   Regole che tengono in piedi le collisioni sotto latenza:

   · SEPARAZIONE MORBIDA, mai vincolo rigido. Un vincolo rigido, quando
     client e server non concordano di un millimetro, incastra.
   · SPINTA LIMITATA per tick. La vecchia formula (raggio-d)/d cresceva
     senza limite: a contatto ravvicinato spostava di 2,3 unità in un
     tick e la velocità di 16.000. Era quello, non solo la latenza, a
     bloccare il personaggio.
   · PROPORZIONALE alla compenetrazione: un disaccordo piccolo produce
     una differenza piccola. È ciò che rende la divergenza limitata
     invece che esplosiva.
   · Ogni entità sposta SOLO SÉ STESSA. Sul server tutti vengono
     processati, quindi la spinta risulta reciproca; sul client, che
     simula solo il giocatore locale, non c'è nulla da contendere. */

const SPINTA_MAX = 0.30;      // unità per tick

/* ══ SALTO ═══════════════════════════════════════════════════════════
   Solo somme e prodotti: nessuna trascendente, quindi il moto balistico
   è bit-identico su client e server e la predizione lo indovina sempre.
   Con questi numeri l'apice sta a 1,70 unità — quanto basta a scavalcare
   un'auto in sosta, che è alta 1,55. È l'unica cosa che si può saltare:
   i palazzi bloccano a qualsiasi quota. */
const GRAVITA = 26, IMPULSO_SALTO = 10.4, AUTO_H = 1.55;

/* L'apice NON è v²/2g: quella formula vale per il moto continuo, mentre
   qui si integra a 20 Hz e il passo discreto perde circa il 13%. Lo
   calcolo eseguendo davvero la traiettoria — solo somme e prodotti,
   quindi identico su ogni motore. Con 9.4 l'apice reale era 1.47 e non
   si scavalcava un'auto alta 1.55, pur dicendo la formula 1.70. */
const APICE_SALTO = (() => {
  let v = IMPULSO_SALTO, z = 0, m = 0;
  for (let k = 0; k < 64; k++){
    v -= GRAVITA * CFG.PASSO; z += v * CFG.PASSO;
    if (z > m) m = z;
    if (z <= 0) break;
  }
  return m;
})();

/* Chi il giocatore i deve schivare. Riempito dal chiamante: il server
   con le posizioni vive degli altri, il client con quelle dell'ultimo
   snapshot ricevuto. */
const VICINI = { x: new Float32Array(64), y: new Float32Array(64),
                        r: new Float32Array(64), n: 0 };

function separa(i, ox, oy, raggio, urto){
  const d2 = ox * ox + oy * oy;
  let nx, ny, pen;
  if (d2 > 1e-8){
    const d = Math.sqrt(d2);
    pen = raggio - d;
    if (pen <= 0) return;
    nx = ox / d; ny = oy / d;
  } else { nx = 1; ny = 0; pen = raggio; }     // sovrapposti esatti: direzione fissa, uguale ovunque
  const s = pen < SPINTA_MAX ? pen : SPINTA_MAX;
  ENT.x[i] += nx * s; ENT.y[i] += ny * s;

  /* Annullo la componente di velocità che punta DENTRO l'ostacolo.
     Senza, con la spinta limitata a 0.30 per tick e un passo di 0.375,
     si attraversa l'altro camminandogli addosso: la correzione di
     posizione non riesce a stare dietro al movimento. Alzare il limite
     avrebbe riportato gli scatti; togliere la velocità no. */
  const vn = ENT.vx[i] * nx + ENT.vy[i] * ny;
  if (vn < 0){ ENT.vx[i] -= nx * vn; ENT.vy[i] -= ny * vn; }

  if (urto > 0){
    const q = (s / SPINTA_MAX) * urto;
    ENT.vx[i] += nx * q; ENT.vy[i] += ny * q;
  }
}

const AUTO_L = 4.3, AUTO_W = 1.9;      // ingombro di un'auto in sosta

function scostaDaScatola(x, y, r, bx, by, bw, bd){
  const sx = (bx - r) - x, ex = (bx + bw + r) - x;
  const sy = (by - r) - y, ey = (by + bd + r) - y;
  if (sx < 0 && ex > 0 && sy < 0 && ey > 0){
    const dx = (-sx < ex) ? sx : ex;
    const dy = (-sy < ey) ? sy : ey;
    if (Math.abs(dx) < Math.abs(dy)) return [x + dx, y];
    return [x, y + dy];
  }
  return null;
}

/* Quota del terreno sotto un punto: zero, o il tetto di un'auto in sosta.
   È ciò che trasforma il salto da "attraversi" a "ci sali sopra" — e a
   4,3 metri di lunghezza un'auto non si scavalca in volo, ci si atterra.
   Costa una scansione di chunk come la collisione, e resta una funzione
   pura della posizione: nessuna dipendenza dal tempo. */
function quotaTerreno(x, y){
  const cx = Math.floor(x / CFG.CHUNK), cy = Math.floor(y / CFG.CHUNK);
  let q = 0;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++){
    const au = chunk(cx + i, cy + j).auto;
    for (let n = 0; n < au.length; n++){
      const a = au[n];
      const hw = (a.asse === 0 ? AUTO_L : AUTO_W) * .5;
      const hd = (a.asse === 0 ? AUTO_W : AUTO_L) * .5;
      const dx = x - a.x, dy = y - a.y;
      if (dx > -hw && dx < hw && dy > -hd && dy < hd && AUTO_H > q) q = AUTO_H;
    }
  }
  return q;
}

/* Palazzi e auto in sosta risolti allo stesso modo: sono entrambi
   ostacoli fermi. È il guadagno di aver tolto il traffico — nessuna
   dipendenza dal tempo, quindi client e server non possono divergere. */
function risolviCollisione(x, y, r, z){
  const c0 = Math.floor((x - r) / CFG.CHUNK), c1 = Math.floor((x + r) / CFG.CHUNK);
  const d0 = Math.floor((y - r) / CFG.CHUNK), d1 = Math.floor((y + r) / CFG.CHUNK);
  for (let cx = c0; cx <= c1; cx++) for (let cy = d0; cy <= d1; cy++){
    const c = chunk(cx, cy);
    const ed = c.edifici;
    for (let n = 0; n < ed.length; n++){
      const b = ed[n];
      const p = scostaDaScatola(x, y, r, b.x, b.y, b.w, b.d);
      if (p){ x = p[0]; y = p[1]; }
    }
    if (z >= AUTO_H) continue;              // in volo sopra il tetto: le auto non fermano
    const au = c.auto;
    for (let n = 0; n < au.length; n++){
      const a = au[n];
      const hw = a.asse === 0 ? AUTO_L : AUTO_W;
      const hd = a.asse === 0 ? AUTO_W : AUTO_L;
      const p = scostaDaScatola(x, y, r, a.x - hw / 2, a.y - hd / 2, hw, hd);
      if (p){ x = p[0]; y = p[1]; }
    }
  }
  return [x, y];
}

/* ══════════ 6. TICK — passo fisso, unico ingresso: intent ══════════

   La quantizzazione avviene QUI DENTRO, non prima dell'invio. Se il
   client predicesse con dx float e spedisse un int8, divergerebbe dal
   server al primo tick — e si manifesterebbe come rubberbanding
   inspiegabile. q(v) = round(clamp(v)*127)/127 è idempotente ed esatta
   in virgola mobile: quantizzare due volte dà lo stesso valore. */

function quantizza(v){
  if (v > 1) v = 1; else if (v < -1) v = -1;
  return Math.round(v * 127) / 127;
}
const impacchetta = v => Math.round((v > 1 ? 1 : v < -1 ? -1 : v) * 127);
const spacchetta  = n => n / 127;

function spawn(i, x, y, stile){
  ENT.viva[i] = 1; ENT.tipo[i] = 1; ENT.stile[i] = stile | 0;
  ENT.x[i] = ENT.px[i] = x; ENT.y[i] = ENT.py[i] = y;
  ENT.z[i] = ENT.pz[i] = 0;
  ENT.vx[i] = ENT.vy[i] = ENT.vz[i] = 0;
}
function rimuovi(i){ ENT.viva[i] = 0; ENT.tipo[i] = 0; }

/* Avanza UNA entità di un tick. Indicizzata, perché il server ne muove
   molte e il client rigioca la propria durante la riconciliazione. */
function passoEntita(i, intent, t){
  const dt = CFG.PASSO;
  ENT.px[i] = ENT.x[i]; ENT.py[i] = ENT.y[i];

  const idx = quantizza(intent.dx), idy = quantizza(intent.dy);
  const S = STILE[ENT.stile[i] & 1] || STILE[0];
  ENT.vx[i] = (ENT.vx[i] + idx * S.acc * dt) * S.attrito;
  ENT.vy[i] = (ENT.vy[i] + idy * S.acc * dt) * S.attrito;
  const sp = Math.sqrt(ENT.vx[i] * ENT.vx[i] + ENT.vy[i] * ENT.vy[i]);
  if (sp > S.vmax){ const f = S.vmax / sp; ENT.vx[i] *= f; ENT.vy[i] *= f; }

  /* Quota. Il bit 1 dello stile è il salto: sta nello stesso byte, quindi
     il pacchetto di input non cresce di un solo bit sul filo. */
  ENT.pz[i] = ENT.z[i];
  let vz = ENT.vz[i] - GRAVITA * dt;
  let z = ENT.z[i] + vz * dt;

  const nx = ENT.x[i] + ENT.vx[i] * dt, ny = ENT.y[i] + ENT.vy[i] * dt;

  /* L'atterraggio va riconosciuto PRIMA di risolvere l'orizzontale.
     Scendendo sotto il tetto mentre si è ancora sopra l'auto, la
     collisione espellerebbe di lato invece di far posare: si vedeva
     come un rimbalzo laterale inspiegabile. La guardia su pz impedisce
     il caso opposto — camminare contro una fiancata non deve
     teletrasportare sul tetto. */
  const suolo = quotaTerreno(nx, ny);
  if (z <= suolo && ENT.pz[i] >= suolo - .02){ z = suolo; vz = 0; }
  ENT.z[i] = z; ENT.vz[i] = vz;

  const p = risolviCollisione(nx, ny, S.raggio, z);
  if (p[0] !== nx) ENT.vx[i] *= -.25;
  if (p[1] !== ny) ENT.vy[i] *= -.25;
  ENT.x[i] = p[0]; ENT.y[i] = p[1];

  // appoggio finale dopo l'eventuale spostamento orizzontale
  const suolo2 = quotaTerreno(ENT.x[i], ENT.y[i]);
  if (ENT.z[i] <= suolo2){
    ENT.z[i] = suolo2;
    ENT.vz[i] = ((intent.stile | 0) & 2) ? IMPULSO_SALTO : 0;
  }

  /* Altri giocatori: separazione morbida. Il client li conosce con
     mezzo RTT di ritardo, il server dal vivo; la differenza è piccola e
     la riconciliazione la assorbe, perché la spinta è proporzionale e
     limitata invece che rigida. */
  const R = S.raggio;
  for (let n = 0; n < VICINI.n; n++)
    separa(i, ENT.x[i] - VICINI.x[n], ENT.y[i] - VICINI.y[n], R + VICINI.r[n], 0);

  /* ── Promozione: ancora da fare. ──────────────────────────────────
     Era l'unica forza dipendente da t nel percorso di simulazione, e
     sotto latenza client e server valutavano le auto a tick diversi:
     le due spinte si combattevano, la riconciliazione le rincorreva e
     il personaggio restava incastrato. Misurato: a 350 ms il giocatore
     era fermo nel 52% dei fotogrammi.

     La strada giusta è la promozione: quando un giocatore tocca
     un'auto, è il SERVER a trasformarla in entità replicata, che da
     quel momento viaggia sul filo come tutte le altre. Fino ad allora
     le auto sono scenografia — costo di rete zero e nessuna presa
     sulla fisica dei giocatori.

     Le auto ora RESPINGONO, ma restano scenografia: non si possono
     danneggiare, guidare o fermare. Per quello serve la promozione —
     il server trasforma quella singola auto in entità replicata e la
     toglie deterministicamente dal campo in forma chiusa. L'aggancio
     è qui. ────────────────────────────────────────────────────────── */
}

/* Comodità per il client a giocatore singolo: avanza il giocatore
   locale e il clock del mondo. */
function passoSim(intent){
  passoEntita(GIOC, intent, stato.t);   // intent.stile porta il bit del salto
  stato.tick++;
  stato.t = stato.tick * CFG.PASSO;
}

/* ══════════ 6b. COLPO — raggio contro SAGOMA ══════════
   Distanza minima fra il raggio e l'asse della capsula. Nessuna
   trascendente: stesso risultato su client e server, quindi il client
   può prevedere l'esito e il server confermarlo senza contraddirlo. */

function colpoSuSagoma(ox, oy, oz, dx, dy, dz, ex, ez, eq){
  const C = SAGOMA.corpo, q = eq || 0;
  // asse capsula: (ex, y0, ez) → (ex, y1, ez), verticale
  const px = ox - ex, pz = oz - ez;
  const a = dx * dx + dz * dz;                 // il raggio proiettato sul piano
  let t;
  if (a < 1e-9) t = 0;
  else t = -(px * dx + pz * dz) / a;
  if (t < 0) t = 0;
  const hx = px + dx * t, hy = oy + dy * t, hz = pz + dz * t;
  const rad = Math.sqrt(hx * hx + hz * hz);
  if (rad > C.r) {
    const T = SAGOMA.testa;
    const tx = hx, ty = hy - (T.y + q), tz = hz;
    return (Math.sqrt(tx * tx + ty * ty + tz * tz) <= T.r) ? { t, parte: 2 } : null;
  }
  if (hy < C.y0 + q || hy > C.y1 + q){
    const T = SAGOMA.testa;
    const ty = hy - (T.y + q);
    return (Math.sqrt(hx * hx + ty * ty + hz * hz) <= T.r) ? { t, parte: 2 } : null;
  }
  return { t, parte: 1 };                      // 1 corpo, 2 testa
}

/* ══════════ 7. AUTOTEST — la firma deve coincidere browser/Node ══════════ */

function autotest(){
  const b = { x: ENT.x[GIOC], y: ENT.y[GIOC], vx: ENT.vx[GIOC], vy: ENT.vy[GIOC],
              px: ENT.px[GIOC], py: ENT.py[GIOC], tick: stato.tick, t: stato.t };
  reset(20, 4);
  const it = { dx: 0, dy: 0, stile: 0 };
  let h = 2166136261;
  for (let i = 0; i < 600; i++){
    it.dx = rnd(i, 1, CFG.SEED) * 2 - 1;      // intent da hash, non da trig
    it.dy = rnd(i, 2, CFG.SEED) * 2 - 1;
    it.stile = rnd(i, 3, CFG.SEED) > .85 ? 2 : 0;   // ogni tanto salta
    passoSim(it);
    h = Math.imul(h ^ ((ENT.x[GIOC] * 4096) | 0), 16777619);
    h = Math.imul(h ^ ((ENT.y[GIOC] * 4096) | 0), 16777619);
    h = Math.imul(h ^ ((ENT.z[GIOC] * 4096) | 0), 16777619);
  }
  /* La firma copre anche il mondo generato: se cambia un tipo di isolato,
     la larghezza di un'arteria o dove si parcheggia, il numero cambia e
     un client vecchio viene rifiutato invece di divergere in silenzio. */
  queryPedoni(-140, -140, 140, 140, 37.5, PEDONI);
  const nPed = PEDONI.n;
  for (let i = 0; i < nPed; i++){
    h = Math.imul(h ^ ((PEDONI.x[i] * 1024) | 0), 16777619);
    h = Math.imul(h ^ ((PEDONI.y[i] * 1024) | 0), 16777619);
  }
  let nOgg = 0;
  for (let cx = -2; cx <= 2; cx++) for (let cy = -2; cy <= 2; cy++){
    const c = chunk(cx, cy);
    nOgg += c.edifici.length + c.auto.length + c.alberi.length + c.pali.length;
    for (const b2 of c.edifici){
      h = Math.imul(h ^ ((b2.x * 64) | 0), 16777619);
      h = Math.imul(h ^ ((b2.h * 64) | 0), 16777619);
    }
    for (const a of c.auto){
      h = Math.imul(h ^ ((a.x * 64) | 0), 16777619);
      h = Math.imul(h ^ ((a.y * 64) | 0), 16777619);
    }
  }
  ENT.x[GIOC] = b.x; ENT.y[GIOC] = b.y; ENT.vx[GIOC] = b.vx; ENT.vy[GIOC] = b.vy;
  ENT.px[GIOC] = b.px; ENT.py[GIOC] = b.py; stato.tick = b.tick; stato.t = b.t;
  return { firma: (h >>> 0).toString(16).padStart(8, '0'), auto: nOgg, pedoni: nPed };
}

/* ══════════════════════════════════════════════════════════════════════
   rete.js — formato dei pacchetti. Nessuna logica di gioco, nessun ws.
   Stesso file su browser e su Node.

   Sul filo passano SOLO giocatori. Traffico e pedoni sono in forma
   chiusa nel core: costo di rete zero, per sempre.
   ══════════════════════════════════════════════════════════════════════ */

const TIPO = { CIAO: 0, BENVENUTO: 1, INPUT: 2, STATO: 3 };
const ESITO = { OK: 0, PROTO: 1, FIRMA: 2, PIENO: 3 };
const MOTIVO = ['ok', 'versione di protocollo diversa', 'firma della simulazione diversa', 'server pieno'];

const SC_POS = 32;      // 1/32 di unità ≈ 3 cm
const SC_VEL = 256;

function ciao(proto, firma){
  const b = new ArrayBuffer(7), d = new DataView(b);
  d.setUint8(0, TIPO.CIAO); d.setUint16(1, proto); d.setUint32(3, firma >>> 0);
  return b;
}

function benvenuto(esito, id, seed, tick){
  const b = new ArrayBuffer(12), d = new DataView(b);
  d.setUint8(0, TIPO.BENVENUTO); d.setUint8(1, esito);
  d.setUint16(2, id); d.setUint32(4, seed >>> 0); d.setUint32(8, tick >>> 0);
  return b;
}

/* Ogni pacchetto porta anche gli input precedenti. Costa 3 byte l'uno e
   rende invisibile la perdita singola: senza, il server resta a secco,
   ripete l'ultimo comando, il client non lo prevede e si vede uno strappo.
   Misurato a 200ms con il 3% di perdita: picco da 57 cm a pochi mm. */
const RIDONDANZA = 3;

function pacchettoInput(lista){
  const n = Math.min(lista.length, RIDONDANZA);
  const b = new ArrayBuffer(4 + n * 3), d = new DataView(b);
  d.setUint8(0, TIPO.INPUT);
  d.setUint16(1, lista[lista.length - 1].seq & 0xffff);
  d.setUint8(3, n);
  for (let i = 0; i < n; i++){                 // [0] è il più recente
    const e = lista[lista.length - 1 - i];
    d.setInt8(4 + i*3, e.dx); d.setInt8(5 + i*3, e.dy); d.setUint8(6 + i*3, e.stile);
  }
  return b;
}

/* Le posizioni degli altri sono RELATIVE a quella autoritativa del
   ricevente: 2 byte per asse invece di 4, con ±1024 unità di raggio.
   L'interest management garantisce che nessuno esca da quel raggio. */
function pacchettoStato(tick, ack, ox, oy, oq, ovx, ovy, ovq, ostile, coda, altri){
  const n = altri.length;
  const b = new ArrayBuffer(29 + n * 8), d = new DataView(b);
  d.setUint8(0, TIPO.STATO);
  d.setUint32(1, tick >>> 0);
  d.setUint16(5, ack & 0xffff);

     un Float32Array, quindi il round-trip è esatto e costa gli stessi 4 byte

     che la riconciliazione poi propagava nel replay. Gli ALTRI restano a
     1/32 di unità: sono interpolati, e 3 cm su un altro giocatore non si
     vedono. */
  d.setFloat32(7, ox); d.setFloat32(11, oy);

     colpo venti volte al secondo, si vede come vibrazione. Lo stato
     resta quello autoritativo; è solo il DISEGNO che raggiunge la
     verità in un decimo di secondo invece che di scatto. */

    tickSim++;

    if (storico.size > 240) storico.delete(tickPred - 240);

       quello del server; se la coda si svuota il server ripete l'ultimo

    } else {
      const e = obiettivo - tickRemoto;         // riaggancio dolce, non a strappi

    }

    ultimiAltri = pkt.altri;
    for (const a of pkt.altri){
      let r = remoti.get(a.id);

      r.buf.push({ tick: pkt.tick, x: a.x, y: a.y, q: a.q, stile: a.stile });

  /* Gli altri giocatori come li conosce la simulazione: posizioni
     dell'ultimo snapshot, non quelle interpolate a schermo (che stanno
     apposta nel passato). */
  function riempiVicini(){

  // confronto di sequenze a 16 bit, resistente al wrap
  function seqPrimaODopo(a, b){ return ((b - a) & 0xffff) < 0x8000; }

  /* Avanza l'orologio dei remoti col tempo reale, non a tick interi:
     è questo che rende il movimento continuo fra uno snapshot e l'altro. */
  function avanzaRemoti(dt){
    if (remotoPronto) tickRemoto += (dt / CFG.PASSO) * velRemoto;
    const k = Math.exp(-dt * 9);           // presentazione, non simulazione
    sPX *= k; sPY *= k; sX *= k; sY *= k;

  function posRemota(rid){

/* ══ SERVER FINTO ══════════════════════════════════════════════════════
   Lo stesso mondo.js che girerebbe su Hetzner, dentro questa pagina, con
   un cavo simulato in mezzo. Non è un mock: passano gli stessi pacchetti,
   la stessa predizione, la stessa riconciliazione. Manca solo il socket.
   Serve a provare e regolare il netcode senza avere un server.        */
const CONDIZIONI = [
  { nome: 'spento',        rtt: 0,   jit: 0,  perso: 0 },
  { nome: 'fibra 30ms',    rtt: 30,  jit: 5,  perso: 0 },
  { nome: '4G 150ms',      rtt: 150, jit: 40, perso: .01 },
  { nome: 'treno 350ms',   rtt: 350, jit: 90, perso: .08 },
];
let iCond = 0, finto = null;

function fermaFinto(){
  if (finto){ clearInterval(finto.battito); finto = null; }
  rete = null;
  for (let i = 8; i < 16; i++) Core.ENT.viva[i] = 0;
}

function avviaFinto(cond){
  fermaFinto();
  // il mondo autoritativo usa gli slot 8+; il giocatore locale predice sullo 0
  const M = Mondo.creaMondo({ slotBase: 8, maxGiocatori: 8 });
  const io = M.entra();
  const bot = [M.entra(), M.entra(), M.entra()];
  const bx = ENT.x[GIOC], by = ENT.y[GIOC];
  Core.ENT.x[io.slot] = bx; Core.ENT.y[io.slot] = by;
  bot.forEach((b, i) => {                       // li metto attorno a te
    Core.ENT.x[b.slot] = bx + Math.cos(i * 2.1) * 14;
    Core.ENT.y[b.slot] = by + Math.sin(i * 2.1) * 14;
  });

  const c = ClientRete.creaClient(GIOC);
  c.id = io.id; c.tick = 1;
  const filo = [];
  const perdi = () => Math.random() < cond.perso;
  const quando = () => performance.now() + cond.rtt / 2 + (Math.random() - .5) * 2 * cond.jit;

  const ws = { readyState: 1, send: p => { if (!perdi()) filo.push({ t: quando(), p, giu: false }); } };
  rete = { ws, c, fase: 'in linea', motivo: '', ping: 0, tUltimo: 0, cond };

  let seqBot = 0, k = 0;
  const battito = setInterval(() => {           // clock proprio: deriva come quello vero
    seqBot++;
    for (let i = 0; i < bot.length; i++){
      const f = k * .04 + i * 2;
      M.riceviInput(bot[i].id, { seq: seqBot,
        dx: Math.round(Math.sin(f) * 110), dy: Math.round(Math.cos(f * .7) * 110), stile: 0 });
    }
    M.passo(); k++;
    const s = M.snapshotPer(io.id);
    if (s && !perdi()) filo.push({ t: quando(), p: s, giu: true });
  }, 1000 / CFG.TICK_HZ);

  finto = { M, io, bot, filo, battito };
}

function consegna(){                             // pompata dal loop di rendering
  if (!finto) return;
  const ora = performance.now();
  for (let i = finto.filo.length - 1; i >= 0; i--){
    if (finto.filo[i].t > ora) continue;
    const v = finto.filo[i]; finto.filo.splice(i, 1);
    const m = Rete.leggi(v.p);
    if (v.giu){
      if (rete.tUltimo) rete.ping = rete.ping * .85 + (ora - rete.tUltimo) * .15;
      rete.tUltimo = ora;
      rete.c.applicaStato(m);
    } else finto.M.riceviInput(finto.io.id, m);
  }
}

  const i=Math.round((wx-ox0)/uX), j=Math.round((wy-oy0)/uY);

  if (!cols) return;

let maxHVicino=18;
function scatola(im, n, x, y, z, sx, sy, sz, colore, rotY){
  if (n >= im.count_max) return n;
  _v.set(x,y,z); _s.set(sx,sy,sz);
  if (rotY) _q.setFromAxisAngle(ASSE_Y, rotY); else _q.set(0,0,0,1);
  _m.compose(_v,_q,_s); im.setMatrixAt(n,_m);
  _c.setHex(colore); im.setColorAt(n,_c);
  return n+1;
}
function ricostruisciCitta(){
  let nE=0,nI=0,nA=0,nC=0,nS=0,nF=0,nT=0,nL=0,hv=8;
  const pcx=Math.floor(ENT.x[GIOC]/CFG.CHUNK), pcy=Math.floor(ENT.y[GIOC]/CFG.CHUNK);
  for (let k=0;k<visibili.length;k++){
    const c=visibili[k];
    const vicino = Math.abs(c.cx-pcx)<=1 && Math.abs(c.cy-pcy)<=1;

    for (let i=0;i<c.isolati.length;i++){
      const b=c.isolati[i];
      const col = b.verde?SUOLO.verde : b.lastra?SUOLO.lastra : b.asfalto?SUOLO.asfalto : SUOLO.costruito;
      nI = scatola(imIs, nI, b.x+b.w/2, .3, b.y+b.d/2, b.w, .6, b.d, col, 0);
    }
    const ed=c.edifici;
    for (let i=0;i<ed.length;i++){
      const b=ed[i];
      if (vicino && b.h>hv) hv=b.h;
      nE = scatola(imEd, nE, b.x+b.w/2, b.h/2, b.y+b.d/2, b.w, b.h, b.d, TINTE[b.t%12], 0);
      // fasce di finestre accese: due o tre per volume, altezze da hash
      if (b.h > 6){
        const q = Core.rnd((b.x*8)|0, (b.y*8)|0, 991);
        const n = 2 + ((q*2)|0);
        for (let f=0; f<n; f++){
          const u = (f + .8 + Core.rnd((b.x*8)|0, f*37, 733)*.5) / (n + .9);
          if (u*b.h > b.h - .8) continue;
          const acceso = Core.rnd((b.x*4)|0, ((b.y*4)|0) + f*13, 617);
          nF = scatola(imFin, nF, b.x+b.w/2, u*b.h, b.y+b.d/2,
                       b.w+.06, .34 + acceso*.22, b.d+.06,
                       acceso > .45 ? 0xffce8a : 0x2c3a52, 0);
        }
      }
    }
    for (let i=0;i<c.arredi.length;i++){
      const a=c.arredi[i];
      nE = scatola(imEd, nE, a.x, a.h/2+.6, a.y, a.w, a.h, a.d, 0x4a5563, 0);
    }
    // auto in sosta: scocca + abitacolo
    for (let i=0;i<c.auto.length;i++){
      const a=c.auto[i];
      const L=Core.AUTO_L, W=Core.AUTO_W;
      const sx = a.asse===0 ? L : W, sz = a.asse===0 ? W : L;
      const col = TINTE_AUTO[a.t%6];
      nA = scatola(imAu, nA, a.x, .62, a.y, sx*.96, .95, sz*.92, col, 0);
      nA = scatola(imAu, nA, a.x, 1.28, a.y, sx*.52, .62, sz*.80, col, 0);
    }
    for (let i=0;i<c.alberi.length;i++){
      const t=c.alberi[i];
      nC = scatola(imCil, nC, t.x, t.h*.35, t.y, t.r, t.h*.7, t.r, 0x4a3f33, 0);
      nS = scatola(imSfe, nS, t.x, t.ch, t.y, t.cr, t.cr*.85, t.cr, TINTE_ALB[t.t%4], 0);
    }
    for (let i=0;i<c.pali.length;i++){
      const p=c.pali[i];
      nC = scatola(imCil, nC, p.x, 2.4, p.y, .1, 4.8, .1, 0x39414d, 0);
      nS = scatola(imSfe, nS, p.x, 4.9, p.y, .28, .22, .28, 0xffe6b0, 0);
      // alone a terra: finge la luce senza aggiungere luci dinamiche,
      // che su mobile sono la prima cosa che fa crollare il framerate
      if (nL < imAlone.count_max){
        _v.set(p.x,.05,p.y); _s.set(3.2,3.2,1);
        _q.setFromAxisAngle(ASSE_X, -Math.PI/2);
        _m.compose(_v,_q,_s); imAlone.setMatrixAt(nL++,_m);
      }
    }
    /* Incroci: strisce pedonali e un palo semaforico. Decorazione pura,
       calcolata qui dalle stesse funzioni del core — nessun bump. */
    for (let ix=0; ix<2; ix++) for (let iy=0; iy<2; iy++){
      const X = c.cx*CFG.CHUNK + 4 + ix*32, Y = c.cy*CFG.CHUNK + 4 + iy*32;
      for (const [dx,dy,sw,sd] of [[0,-5.4,6.4,1.5],[0,5.4,6.4,1.5],[-5.4,0,1.5,6.4],[5.4,0,1.5,6.4]])
        nT = scatola(imStr, nT, X+dx, .62, Y+dy, sw, .06, sd, 0x8f97a4, 0);
      nC = scatola(imCil, nC, X+4.6, 2.9, Y+4.6, .09, 5.8, .09, 0x333a45, 0);
      nT = scatola(imStr, nT, X+4.6, 5.6, Y+4.6, .3, .8, .3, 0x1a1d24, 0);
      nS = scatola(imSfe, nS, X+4.6, 5.85, Y+4.35, .11, .11, .11, 0x8fd694, 0);
    }
  }
  maxHVicino = hv;
  imAlone.count = nL; imAlone.instanceMatrix.needsUpdate = true;
  for (const [im,n] of [[imEd,nE],[imIs,nI],[imAu,nA],[imCil,nC],[imSfe,nS],[imFin,nF],[imStr,nT]]){
    im.count = n;
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
  }
}


/* ══ CIELO DINAMICO: CICLO COMPLETO IN 10 MINUTI ══════════════════ */
const SKY_CYCLE=600;
let skyNext=-1,skyTop,skyHorizon,skyWarm,skyFog,skyTmp;

function updateSky(time){
  if(!tre||!cupola||time<skyNext)return;
  skyNext=time+.10;

  if(!skyTop){
    skyTop=new THREE.Color();
    skyHorizon=new THREE.Color();
    skyWarm=new THREE.Color();
    skyFog=new THREE.Color();
    skyTmp=new THREE.Color();
  }

  const phase=(time%SKY_CYCLE)/SKY_CYCLE;
  const angle=phase*Math.PI*2-Math.PI/2;
  const elevation=Math.sin(angle);
  const day=Math.max(0,Math.min(1,elevation*1.7+.22));
  const dusk=Math.max(0,1-Math.abs(elevation)*3.1);

  skyTop.setHex(0x080d1c).lerp(skyTmp.setHex(0x4e83c4),day);
  skyHorizon.setHex(0x161b31).lerp(skyTmp.setHex(0x9abbd1),day);
  skyWarm.setHex(0x403044).lerp(skyTmp.setHex(0xff9a62),dusk);
  skyFog.setHex(0x151728).lerp(skyTmp.setHex(0x879eaa),day);
  skyFog.lerp(skyWarm,dusk*.22);

  const pos=cupola.geometry.attributes.position;
  const col=cupola.geometry.attributes.color;

  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i),x=pos.getX(i),z=pos.getZ(i);
    const up=Math.max(0,Math.min(1,(y+.12)/1.12));
    skyTmp.copy(skyHorizon).lerp(skyTop,up*up);
    const heat=Math.max(0,-z*.7+x*.7)*
      Math.max(0,1-Math.abs(y)*2.6)*
      (.25+dusk*.75);
    skyTmp.lerp(skyWarm,heat*.64);
    col.setXYZ(i,skyTmp.r,skyTmp.g,skyTmp.b);
  }

  col.needsUpdate=true;
  scena.fog.color.copy(skyFog);
  ren.setClearColor(skyFog,1);

  if(sole){
    sole.color.setHex(0xffd6a0).lerp(skyWarm,dusk*.55);
    sole.intensity=.12+day*.83+dusk*.18;
    sole.position.set(Math.cos(angle)*.8,Math.max(-.35,elevation),.42);
  }
}

const ASSE_Y={x:0,y:1,z:0}, ASSE_X={x:1,y:0,z:0};
let camYaw=0,camYawTgt=0,camPitch=.74,camPitchTgt=.74,camZoom=1;
const PITCH_MIN=.22, PITCH_MAX=1.36, ZOOM_MIN=.6, ZOOM_MAX=1.9;
let camAlt=18,camDist=22,camX=0,camY=0,velLisc=0,altQuart=5,dirX=1,dirZ=0,fasePasso=0,ultX=0,ultY=0;
const remotiVista=new Map();
function disegna3d(gx,gy,vel,tempo,dt,alphaR){
  if (!tre) return;
  updateSky(tempo);
  const zq = ENT.pz[GIOC] + (ENT.z[GIOC]-ENT.pz[GIOC])*alphaR;   // quota interpolata
  const baseQ = Core.quotaTerreno(gx,gy);
  const distacco = Math.max(0,zq-baseQ);
  const ariaObiettivo = Math.max(0,Math.min(1,distacco/.55));
  _ariaPose += (ariaObiettivo-_ariaPose)*Math.min(1,dt*14);

  // orientamento del giocatore: stato di presentazione, fuori dalla firma
  if (vel>.15){
    const nx=ENT.vx[GIOC]/vel, ny=ENT.vy[GIOC]/vel;
    dirX += (nx-dirX)*.22; dirZ += (ny-dirZ)*.22;
    const l=Math.sqrt(dirX*dirX+dirZ*dirZ)||1; dirX/=l; dirZ/=l;
  }

  const inAuto = ENT.stile[GIOC]===1;

  // ── personaggi ──
  nO=0; nG=0;
  const PED=Core.PEDONI;
  let vicini=0;
  for (let i=0;i<PED.n;i++){
    const dx=PED.x[i]-gx, dy=PED.y[i]-gy;
    const d2=dx*dx+dy*dy;
    _c.setHex(TINTE_PED[PED.tinta[i]&3]);
    if (d2 < 900 && vicini < 10){          // entro 30 unità: scheletro intero
      vicini++;
      const hx = PED.asse[i]===0 ? PED.dir[i] : 0;
      const hz = PED.asse[i]===0 ? 0 : PED.dir[i];
      const lungo = PED.asse[i]===0 ? PED.x[i] : PED.y[i];
      scheletro(PED.x[i],PED.y[i],hx,hz, lungo*1.55*PED.dir[i], .85, tempo, _c);
    } else {
      sagomaLontana(PED.x[i],PED.y[i],_c,0);
    }
  }
  // altri giocatori: interpolati indietro nel tempo, non all'ultimo pacchetto
  if (inLinea()){
    for (const rid of rete.c.remoti.keys()){
      const p = rete.c.posRemota(rid);
      if (!p) continue;
      let st = remotiVista.get(rid);
      if (!st){ st = {x:p.x, y:p.y, hx:1, hz:0, fase:0}; remotiVista.set(rid, st); }
      const mx = p.x-st.x, my = p.y-st.y, d = Math.sqrt(mx*mx+my*my);
      if (d > .004){ st.hx += (mx/d-st.hx)*.25; st.hz += (my/d-st.hz)*.25;
        const l = Math.sqrt(st.hx*st.hx+st.hz*st.hz)||1; st.hx/=l; st.hz/=l; }
      st.fase += d/.58; st.x = p.x; st.y = p.y;
      const amp = Math.min(1, (dt>0 ? d/dt : 0)/6.2);
      _c.setHex(0x8fd694);
      scheletro(p.x, p.y, st.hx, st.hz, st.fase, amp, tempo, _c, p.q||0);
    }
  }

  // giocatore
  const a = vel>.15 ? Math.min(1, vel/6.2) : 0;
  fasePasso += Math.sqrt((gx-ultX)*(gx-ultX)+(gy-ultY)*(gy-ultY))/.58;
  ultX=gx; ultY=gy;
  if (!inAuto){ _c.setHex(0xf2f6fa); scheletro(gx,gy,dirX,dirZ,fasePasso,a,tempo,_c,zq); }
  autoGioc.visible = inAuto;
  if (inAuto){
    autoGioc.position.set(gx, .04+zq, gy);
    autoGioc.rotation.y = Math.atan2(dirX, dirZ) - Math.PI/2;
  }

  imOs.count=nO; imGi.count=nG;
  imOs.instanceMatrix.needsUpdate=true; imGi.instanceMatrix.needsUpdate=true;
  if (imOs.instanceColor) imOs.instanceColor.needsUpdate=true;
  if (imGi.instanceColor) imGi.instanceColor.needsUpdate=true;

  suolo.position.x=Math.round(gx/64)*64; suolo.position.z=Math.round(gy/64)*64;

  /* Camera. Lo smorzamento è a COSTANTE DI TEMPO, non per fotogramma:
     con `x += (obiettivo-x)*0.05` la camera recupera lo stesso tratto in
     un fotogramma da 12 ms e in uno da 24, quindi resta indietro in modo
     diseguale e trema. Su un telefono i tempi di fotogramma variano
     sempre — throttling termico, GC, 60 contro 90 Hz. Misurato: p50
     0.72× e picchi a 7.8× col framerate irregolare. */
  const lisc = tau => 1 - Math.exp(-dt * tau);   // presentazione, non simulazione
  velLisc += (vel - velLisc) * lisc(6);          // anche la velocità è una scala a 20 Hz
  altQuart += (Math.min(maxHVicino*.30, 15) - altQuart) * lisc(1.2);
  const dTgt = 12 + velLisc*.95;
  const aTgt = 9 + velLisc*.8 + altQuart;
  const k = lisc(3.2);
  camDist += (dTgt-camDist)*k; camAlt += (aTgt-camAlt)*k;
  /* In sola vista ascii l'imbardata torna a zero: quella griglia è
     sempre nord-alto, e con l'intent ruotato i comandi sarebbero
     incomprensibili. In 3d e in doppia l'ascii fa da minimappa. */
  if (modo === 'solo-ascii') camYawTgt = 0;
  const ko = lisc(9);
  camYaw += (camYawTgt-camYaw)*ko; camPitch += (camPitchTgt-camPitch)*ko;
  /* La camera insegue la posizione, non la copia: assorbe il residuo di
     tremolio e a velocità alta resta leggermente indietro, che è come si
     comporta una camera in terza persona. Ritardo a regime ≈ v/12: 60 cm
     a piedi, 2 metri in auto. */
  const ki = lisc(12);
  camX += (gx-camX)*ki; camY += (gy-camY)*ki;
  /* Orbita vera: raggio, imbardata, elevazione. Lo zoom è LIMITATO di
     proposito — il campo visivo era fissato in unità mondo perché chi ha
     lo schermo grande non veda più mondo degli altri, e uno zoom libero
     smonterebbe quella scelta. In sfida andrà bloccato del tutto. */
  const R = (camDist + camAlt*.35) * camZoom;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const sy = Math.sin(camYaw), cy2 = Math.cos(camYaw);
  cam.position.set(camX + sy*cp*R, Math.max(1.6, sp*R) + zq*.5, camY + cy2*cp*R);
  cam.lookAt(camX, 1.05 + zq*.7, camY);
  cupola.position.copy(cam.position);
  ren.render(scena,cam);
}

/* ── INPUT: layer di intent, unico canale verso il core ──────────────
   Metà sinistra: joystick. Metà destra: trascina per ruotare la camera,
   tocca senza trascinare per saltare. Due dita: pizzica per lo zoom.
   Tastiera: WASD, spazio salta, Q/E ruotano, rotella zooma.

   Il punto che conta: la rotazione della camera si applica all'intent
   PRIMA della quantizzazione e dell'invio. Sul filo viaggia sempre un
   intent in coordinate mondo, e il server resta all'oscuro di dove stai
   guardando — se l'orientamento della camera filtrasse nel server,
   avresti legato la presentazione alla simulazione. */
const tasti=Object.create(null);
addEventListener('keydown',e=>{ if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  tasti[e.key.toLowerCase()]=1; if (e.key===' ') tasti[' ']=1; });
addEventListener('keyup',e=>{ tasti[e.key.toLowerCase()]=0; if (e.key===' ') tasti[' ']=0; });

const stick=document.getElementById('stick'), pollice=document.getElementById('pollice');
const zona=document.getElementById('viste');
const dita=new Map();
let idMov=-1, tox=0, toy=0, tdx=0, tdy=0, saltoTocco=0;
let idCam=-1, cx0=0, cy0=0, camMosso=0, tCam=0;
let pizzicoBase=0, zoomBase=1;
const RS=46;

function meta(x){ return x < zona.clientWidth*.5 ? 0 : 1; }

zona.addEventListener('pointerdown',e=>{
  const side=meta(e.clientX);
  dita.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY,
    side,
    role:''
  });

  zona.setPointerCapture(e.pointerId);
  document.getElementById('aiuto').style.opacity='0';

  if(side===1&&idCam>=0&&e.pointerId!==idCam){
    const d=dita.get(e.pointerId);
    d.role='jump';
    saltoTocco=4;
    return;
  }

  if(side===0&&idMov<0){
    const d=dita.get(e.pointerId);
    d.role='move';
    idMov=e.pointerId;
    tox=e.clientX;
    toy=e.clientY;
    stick.style.left=tox+'px';
    stick.style.top=toy+'px';
    stick.classList.add('on');
    pollice.style.transform='translate(0,0)';
    return;
  }

  if(side===1&&idCam<0){
    const d=dita.get(e.pointerId);
    d.role='camera';
    idCam=e.pointerId;
    cx0=e.clientX;
    cy0=e.clientY;
    camMosso=0;
    tCam=performance.now();
  }
});

zona.addEventListener('pointermove',e=>{
  const d=dita.get(e.pointerId);
  if(d){
    d.x=e.clientX;
    d.y=e.clientY;
  }

  if(e.pointerId===idMov){
    let dx=e.clientX-tox;
    let dy=e.clientY-toy;
    const len=Math.sqrt(dx*dx+dy*dy);

    if(len>RS){
      dx=dx/len*RS;
      dy=dy/len*RS;
    }

    pollice.style.transform='translate('+dx+'px,'+dy+'px)';
    tdx=dx/RS;
    tdy=dy/RS;
    return;
  }

  if(e.pointerId===idCam){
    const dx=e.clientX-cx0;
    const dy=e.clientY-cy0;

    camMosso=Math.max(camMosso,Math.abs(dx)+Math.abs(dy));
    camYawTgt-=dx*.006;
    camPitchTgt=Math.max(
      PITCH_MIN,
      Math.min(PITCH_MAX,camPitchTgt+dy*.004)
    );

    cx0=e.clientX;
    cy0=e.clientY;
  }
});

function suRilascio(e){
  const d=dita.get(e.pointerId);
  dita.delete(e.pointerId);

  if(e.pointerId===idMov){
    idMov=-1;
    tdx=0;
    tdy=0;
    stick.classList.remove('on');
  }

  if(e.pointerId===idCam){
    if(camMosso<12&&performance.now()-tCam<260){
      saltoTocco=4;
    }
    idCam=-1;
  }

  if(d&&d.role==='jump'){
    saltoTocco=Math.max(saltoTocco,3);
  }

  if(dita.size<2)pizzicoBase=0;
}

zona.addEventListener('pointerup',suRilascio);
zona.addEventListener('pointercancel',suRilascio);
zona.addEventListener('wheel',e=>{
  e.preventDefault();
  camZoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX, camZoom*(1+Math.sign(e.deltaY)*.09)));
},{passive:false});

let stileScelto = 0;
const intent={dx:0,dy:0,stile:0};
function leggiIntent(){
  let dx=0,dy=0;
  if (tasti['a']||tasti['arrowleft']) dx-=1;
  if (tasti['d']||tasti['arrowright']) dx+=1;
  if (tasti['w']||tasti['arrowup']) dy-=1;
  if (tasti['s']||tasti['arrowdown']) dy+=1;
  if (tasti['q']) camYawTgt += .045;
  if (tasti['e']) camYawTgt -= .045;
  const l=Math.sqrt(dx*dx+dy*dy); if (l>1){ dx/=l; dy/=l; }
  if (idMov>=0 && (tdx||tdy)){ dx=tdx; dy=tdy; }

  // rotazione nel sistema del mondo, prima della quantizzazione
  const c=Math.cos(camYaw), sn=Math.sin(camYaw);
  intent.dx = dx*c + dy*sn;
  intent.dy = -dx*sn + dy*c;

  const salta = tasti[' '] || saltoTocco>0;
  if (saltoTocco>0) saltoTocco--;
  intent.stile = (stileScelto & 1) | (salta?2:0);
}


/* ══ MINIMAPPA APRIBILE ═══════════════════════════════════════════ */
const miniMap=document.getElementById('miniMap');
const miniCanvas=document.getElementById('miniCanvas');
const miniClose=document.getElementById('miniClose');
const miniCtx=miniCanvas.getContext('2d',{alpha:false});

let miniOpen=false;
let miniNext=0;
let miniDpr=1;

const ZONE_COLORS=[
  '#34485e',
  '#687d57',
  '#5a5752',
  '#31583c',
  '#315f78',
  '#777a75'
];

function zoneAt(mx,my){
  return Core.hash32(mx,my,CFG.SEED^0x6b51d2a7)%ZONE_COLORS.length;
}

function setMini(open){
  miniOpen=open;
  miniMap.classList.toggle('open',open);
  miniMap.setAttribute('aria-expanded',String(open));
  miniMap.setAttribute('aria-label',open?'Chiudi minimappa':'Apri minimappa');
  miniNext=0;
}

for(const type of ['pointerdown','pointermove']){
  miniMap.addEventListener(type,e=>{
    e.preventDefault();
    e.stopPropagation();
  });
}

miniMap.addEventListener('pointerup',e=>{
  e.preventDefault();
  e.stopPropagation();
  if(e.target!==miniClose)setMini(!miniOpen);
});

miniClose.addEventListener('pointerup',e=>{
  e.preventDefault();
  e.stopPropagation();
  setMini(false);
});

miniMap.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    setMini(!miniOpen);
  }else if(e.key==='Escape'){
    setMini(false);
  }
});

function resizeMini(){
  const r=miniMap.getBoundingClientRect();
  miniDpr=Math.min(window.devicePixelRatio||1,1.5);
  const w=Math.max(2,Math.round(r.width*miniDpr));
  const h=Math.max(2,Math.round(r.height*miniDpr));

  if(miniCanvas.width!==w||miniCanvas.height!==h){
    miniCanvas.width=w;
    miniCanvas.height=h;
  }
}

function drawMini(gx,gy,now){
  if(now<miniNext)return;
  miniNext=now+(miniOpen?120:220);
  resizeMini();

  const W=miniCanvas.width;
  const H=miniCanvas.height;
  const scale=miniOpen
    ?Math.max(.8,Math.min(W,H)/760)
    :Math.max(.38,Math.min(W,H)/245);

  const halfX=W/(2*scale);
  const halfY=H/(2*scale);
  const x0=gx-halfX,x1=gx+halfX;
  const y0=gy-halfY,y1=gy+halfY;
  const macro=CFG.CHUNK*4;

  miniCtx.fillStyle='#0a1018';
  miniCtx.fillRect(0,0,W,H);

  const mx0=Math.floor(x0/macro)-1;
  const mx1=Math.floor(x1/macro)+1;
  const my0=Math.floor(y0/macro)-1;
  const my1=Math.floor(y1/macro)+1;

  for(let mx=mx0;mx<=mx1;mx++){
    for(let my=my0;my<=my1;my++){
      const sx=W/2+(mx*macro-gx)*scale;
      const sy=H/2+(my*macro-gy)*scale;
      miniCtx.fillStyle=ZONE_COLORS[zoneAt(mx,my)];
      miniCtx.fillRect(
        Math.floor(sx),
        Math.floor(sy),
        Math.ceil(macro*scale)+1,
        Math.ceil(macro*scale)+1
      );
    }
  }

  miniCtx.strokeStyle='rgba(220,229,235,.40)';
  miniCtx.lineWidth=Math.max(1,2*miniDpr);
  miniCtx.beginPath();

  let line=Math.floor((x0-CFG.OFF)/CFG.LINEA)*CFG.LINEA+CFG.OFF;
  for(;line<=x1;line+=CFG.LINEA){
    const sx=W/2+(line-gx)*scale;
    miniCtx.moveTo(sx,0);
    miniCtx.lineTo(sx,H);
  }

  line=Math.floor((y0-CFG.OFF)/CFG.LINEA)*CFG.LINEA+CFG.OFF;
  for(;line<=y1;line+=CFG.LINEA){
    const sy=H/2+(line-gy)*scale;
    miniCtx.moveTo(0,sy);
    miniCtx.lineTo(W,sy);
  }
  miniCtx.stroke();

  miniCtx.fillStyle='rgba(6,10,16,.76)';
  for(let c=0;c<visibili.length;c++){
    const buildings=visibili[c].edifici;
    for(let i=0;i<buildings.length;i++){
      const b=buildings[i];
      if(b.x+b.w<x0||b.x>x1||b.y+b.d<y0||b.y>y1)continue;
      miniCtx.fillRect(
        W/2+(b.x-gx)*scale,
        H/2+(b.y-gy)*scale,
        Math.max(1,b.w*scale),
        Math.max(1,b.d*scale)
      );
    }
  }

  miniCtx.save();
  miniCtx.translate(W/2,H/2);
  miniCtx.rotate(-camYaw);
  miniCtx.fillStyle='#f3c16d';
  miniCtx.beginPath();
  miniCtx.moveTo(0,-10*miniDpr);
  miniCtx.lineTo(7*miniDpr,8*miniDpr);
  miniCtx.lineTo(0,5*miniDpr);
  miniCtx.lineTo(-7*miniDpr,8*miniDpr);
  miniCtx.closePath();
  miniCtx.fill();
  miniCtx.restore();

  if(miniOpen){
    miniCtx.fillStyle='rgba(5,9,14,.78)';
    miniCtx.fillRect(10*miniDpr,H-36*miniDpr,245*miniDpr,25*miniDpr);
    miniCtx.fillStyle='#dfe7ee';
    miniCtx.font=(11*miniDpr)+'px ui-monospace,Menlo,monospace';
    miniCtx.fillText(
      'x '+gx.toFixed(0)+'  y '+gy.toFixed(0)+'  · tap per chiudere',
      17*miniDpr,
      H-19*miniDpr
    );
  }
}


/* ── LOOP ── */
let acc=0,ultimo=performance.now(),fps=0,fAcc=0,fCnt=0,modo='split';
const hud=document.getElementById('hud');
let FIRMA='—';

function frame(ora){
  let dt=(ora-ultimo)/1000; ultimo=ora;
  if (dt>.25) dt=.25;
  acc+=dt;
  consegna();
  let n=0;
  // il PASSO di simulazione resta esatto: si dilata solo l'intervallo fra i passi
  const passoEff = inLinea() ? CFG.PASSO*rete.c.dilatazione : CFG.PASSO;
  while (acc>=passoEff && n++<5){
    leggiIntent();
    if (inLinea()){
      const pkt = rete.c.predici(intent, intent.stile);
      if (rete.ws.readyState===1) rete.ws.send(pkt);
      stato.tick = rete.c.tickSim; stato.t = stato.tick*CFG.PASSO;
    } else Core.passoSim(intent);
    acc-=passoEff;
  }
  const alpha=acc/passoEff;

  let gx=ENT.px[GIOC]+(ENT.x[GIOC]-ENT.px[GIOC])*alpha;
  let gy=ENT.py[GIOC]+(ENT.y[GIOC]-ENT.py[GIOC])*alpha;
  if (inLinea()){
    rete.c.avanzaRemoti(dt);
    const sc = rete.c.scarto(alpha);          // la correzione arriva liscia, non di scatto
    gx += sc.x; gy += sc.y;
  }

  const k=Core.aggiornaVisibili(gx,gy);
  if (k!==chiave){ chiave=k; if (tre) ricostruisciCitta(); }

  // traffico valutato a t frazionario: posizione esatta, non interpolata
  const tSim = stato.t+alpha*CFG.PASSO;
  Core.queryPedoni(gx-RAGGIO_PED, gy-RAGGIO_PED, gx+RAGGIO_PED, gy+RAGGIO_PED, tSim, Core.PEDONI);

  const vel = Math.sqrt(ENT.vx[GIOC]*ENT.vx[GIOC]+ENT.vy[GIOC]*ENT.vy[GIOC]);
  if (modo!=='solo-3d') disegnaAscii(gx,gy);
  if (modo!=='solo-ascii') disegna3d(gx,gy,vel,ora*.001,dt,alpha);
  drawMini(gx,gy,ora);

  fAcc+=dt; fCnt++;
  if (fAcc>.4){ fps=fCnt/fAcc; fAcc=0; fCnt=0; aggiornaHud(); }
  requestAnimationFrame(frame);
}
function aggiornaHud(){
  const dc = tre&&modo!=='solo-ascii' ? ren.info.render.calls : 0;
  const tr = tre&&modo!=='solo-ascii' ? ren.info.render.triangles : 0;
  const cap = inLinea()
    ? `<span class="cal">${finto ? 'finta '+rete.cond.nome : 'rete'}</span> ${rete.c.remoti.size+1} in linea`
    : (rete ? `<span class="cal">rete</span> ${rete.fase}` : 'locale');
  hud.innerHTML =
    `<b>${fps.toFixed(0)}</b> fps · ${cap} · <b>${imAu?imAu.count>>1:0}</b> auto · <b>${Core.PEDONI.n}</b> pedoni · `+
    `draw call <span class="cal">${dc}</span> · rete <span class="cal">0 B</span>`+
    `<div class="riga2">tick ${CFG.TICK_HZ}hz · griglia ${cols}×${rows} · ridipinte `+
    `<span class="cal">${cellePitturate}</span>/${cols*rows} · tri ${(tr/1000).toFixed(1)}k<br>`+
    `chunk ${chunkCache.size} · x ${ENT.x[GIOC].toFixed(0)} y ${ENT.y[GIOC].toFixed(0)} · `+
    `proto ${Core.PROTO} · firma <span class="fir">${FIRMA}</span>${rigaRete()}</div>`;
}
function rigaRete(){
  if (!rete) return '';
  if (!inLinea()) return `<br>rete ${rete.fase}${rete.motivo? ' — '+rete.motivo : ''}`;
  const d = rete.c.diagnostica;
  return `<br>id ${rete.c.id} · snapshot ogni ${rete.ping.toFixed(0)}ms · coda ${rete.c.coda} · `+
    `buffer ${rete.c.ritardo.toFixed(1)} tick · `+
    `dilatazione ${rete.c.dilatazione.toFixed(3)} · in sospeso ${rete.c.inSospeso}<br>`+
    `errore di predizione <span class="cal">${(d.errMedio*100).toFixed(2)}cm</span> medio · `+
    `${(d.errMax*100).toFixed(1)}cm picco · ${d.correzioni}/${d.campioni} correzioni`;
}
hud.addEventListener('click',()=>hud.classList.toggle('aperto'));

const bFinto=document.getElementById('bFinto');
bFinto.addEventListener('click',()=>{
  if (urlRete){ return; }                       // c'è un server vero: non interferisco
  iCond = (iCond+1) % CONDIZIONI.length;
  const c = CONDIZIONI[iCond];
  bFinto.textContent = iCond ? c.nome : 'prova rete';
  bFinto.setAttribute('aria-pressed', String(iCond>0));
  if (iCond) avviaFinto(c); else fermaFinto();
});

/* La scelta a piedi/in auto vive nel layer di input, non in ENT.stile.
   Tenerla nell'entità era un bug sotto latenza: la riconciliazione
   riscrive ENT.stile rigiocando gli input pendenti, e se ne rigiocava
   uno anteriore al clic la scelta tornava indietro da sola. Lo stato
   dell'interfaccia appartiene all'interfaccia; l'entità riceve solo
   quello che l'intent le dice. */
const bStile=document.getElementById('bStile');
bStile.addEventListener('click',()=>{
  stileScelto = stileScelto ? 0 : 1;
  bStile.textContent = stileScelto ? 'in auto' : 'a piedi';
  bStile.setAttribute('aria-pressed', String(stileScelto === 1));
});
const bottoni={'solo-ascii':document.getElementById('bAscii'),
               'split':document.getElementById('bSplit'),
               'solo-3d':document.getElementById('b3d')};
function setModo(m){
  if (!tre && m!=='solo-ascii') return;
  modo=m; document.body.className=m;
  for (const k in bottoni) bottoni[k].setAttribute('aria-pressed',String(k===m));
  pG.fill(255);
  requestAnimationFrame(()=>{ ridimensionaAscii(); ridimensiona3d(); });
}
for (const k in bottoni) bottoni[k].addEventListener('click',()=>setModo(k));
addEventListener('resize',()=>{ ridimensionaAscii(); ridimensiona3d(); miniNext=0; });
document.addEventListener('visibilitychange',()=>{ if (!document.hidden){ ultimo=performance.now(); acc=0; } });

/* ── avvio ── */
init3d();
Core.reset(20,4);
FIRMA = Core.autotest().firma;          // deve coincidere con quella stampata da verifica.js
console.log('firma core:', FIRMA, '· proto', Core.PROTO);
if (urlRete) collega();
ridimensionaAscii(); ridimensiona3d();
Core.aggiornaVisibili(ENT.x[GIOC],ENT.y[GIOC]);
ultX=ENT.x[GIOC]; ultY=ENT.y[GIOC]; camX=ENT.x[GIOC]; camY=ENT.y[GIOC];
if (tre) ricostruisciCitta();
setTimeout(()=>{ document.getElementById('aiuto').style.opacity='0'; },6000);
requestAnimationFrame(frame);
</script>
