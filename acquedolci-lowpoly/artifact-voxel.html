<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Acquedolci — motore voxel</title>
    <link rel="stylesheet" href="/src/style.css" />

  <body>
    <div id="app">
      <div id="ui">

          </div>

        <div id="hint">
          <span class="hint-desktop"><strong>PC:</strong> WASD · Shift corri · trascina orbita · rotella zoom</span>

        <div id="stats">Caricamento…</div>
      </div>
      <canvas id="c"></canvas>
      <div id="loader"><div class="l-card"><h2>Costruisco la città…</h2><p id="loader-msg">Caricamento</p><div class="l-bar"><i></i></div></div></div>

    <script type="module" src="/src/artifact/entry-voxel.js"></script>
